services:
  - type: web
    name: talkz-cloud
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: talkz-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"

databases:
  - name: talkz-db
    plan: free
    databaseName: talkz
    user: talkz_user
